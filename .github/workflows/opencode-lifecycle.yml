name: OpenCode Autonomous Developer Lifecycle

on:
  # 1. Daily midnight scan + manual trigger for testing
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

  # 2. Issue comment trigger (/oc fix or /opencode fix)
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  security-events: write
  id-token: write

jobs:
  # --- JOB 1: CODEBASE SCAN (BUGS VS PRIVATE SECURITY ADVISORIES) ---
  scan-and-report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: OpenCode Codebase Scan
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/big-pickle
          prompt: >
            Perform a thorough static analysis scan of the repository.
            Categorize any findings strictly as follows:

            1. CRITICAL OR HIGH-SEVERITY SECURITY VULNERABILITIES:
               NEVER report these by creating a public GitHub Issue.
               Instead, report them privately directly to the repository's Security tab
               as a draft Repository Security Advisory using GitHub CLI / API:
               gh api repos/${{ github.repository }}/security-advisories -X POST \
                 -f summary="<Brief vulnerability summary>" \
                 -f description="<Impact, affected files/components, reproduction steps, and remediation>" \
                 -f severity="<critical|high>"

            2. GENERAL BUGS, CODE DEFECTS & REGRESSIONS:
               Create a standard GitHub Issue detailing the problem, affected files,
               and suggested fix. Attach the labels "bug" and "automated-scan".

  # --- JOB 2: TAGGED FIXES & PR CREATION ---
  fix-issue-on-tag:
    if: >
      github.event_name == 'issue_comment' &&
      (contains(github.event.comment.body, '/oc fix') || contains(github.event.comment.body, '/opencode fix'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: OpenCode Generate Code Fix
        uses: anomalyco/opencode/github@latest
        id: opencode_fix
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/big-pickle
          prompt: >
            Resolve Issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".
            Instruction from comment: "${{ github.event.comment.body }}".
            Apply only the minimal required fix without altering unrelated files.

      - name: Create Pull Request for Human Approval
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: automated AI resolution for Issue #${{ github.event.issue.number }}"
          title: "🤖 OpenCode Fix: Issue #${{ github.event.issue.number }}"
          body: |
            This Pull Request was automatically generated by OpenCode to resolve Issue #${{ github.event.issue.number }}.

            **Requested by:** @${{ github.event.comment.user.login }}
            Please review the changes and approve/merge.
          branch: opencode-fix-issue-${{ github.event.issue.number }}
          delete-branch: true
